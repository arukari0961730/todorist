<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ゲーム開発サークル向け作業管理アプリ</title>

  <link rel="stylesheet" href="todorist.css">

  <!--
    type="module" を付けることで、
    todorist.js から data.js を読み込める
  -->
  <script type="module" src="todorist.js"></script>
</head>

<body>

  <!-- タスク詳細・編集モーダル -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h2>課題詳細</h2>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="app-header">
    <h1>ゲーム開発サークル向け作業管理アプリ</h1>
  </header>

  <div class="app-layout">

    <!-- サイドバー -->
    <aside class="sidebar">
      <h2>チーム</h2>

      <!-- teams.js のデータから生成 -->
      <div id="teamList" class="team-list"></div>

      <div class="team-actions">
        <button
          id="showTeamFormBtn"
          class="team-action-btn team-add-btn"
          type="button"
        >
          ＋ チームを追加
        </button>

        <button
          id="showTeamRenameBtn"
          class="team-action-btn team-rename-btn"
          type="button"
        >
          チーム名を変更
        </button>

        <button
          id="deleteTeamBtn"
          class="team-action-btn team-delete-btn"
          type="button"
        >
          選択中を削除
        </button>
      </div>

      <div
        id="teamCreateArea"
        class="team-create-area hidden"
      >
        <label for="teamNameInput">新しいチーム名</label>

        <input
          type="text"
          id="teamNameInput"
          maxlength="30"
          placeholder="チーム名を入力"
        >

        <div class="team-create-buttons">
          <button
            id="saveTeamBtn"
            class="team-save-btn"
            type="button"
          >
            追加
          </button>

          <button
            id="cancelTeamBtn"
            class="team-cancel-btn"
            type="button"
          >
            キャンセル
          </button>
        </div>
      </div>

      <div
        id="teamRenameArea"
        class="team-create-area team-rename-area hidden"
      >
        <label for="teamRenameInput">新しいチーム名</label>

        <input
          type="text"
          id="teamRenameInput"
          maxlength="30"
          placeholder="変更後のチーム名"
        >

        <div class="team-create-buttons">
          <button
            id="saveTeamRenameBtn"
            class="team-save-btn"
            type="button"
          >
            変更
          </button>

          <button
            id="cancelTeamRenameBtn"
            class="team-cancel-btn"
            type="button"
          >
            キャンセル
          </button>
        </div>
      </div>

      <p id="teamMessage" class="team-message"></p>

      <hr>

      <nav class="side-menu">
        <button
          id="taskMenuBtn"
          class="menu-btn active"
          type="button"
        >
          タスク
        </button>

        <button
          id="chatMenuBtn"
          class="menu-btn"
          type="button"
        >
          チャット
        </button>

        <button
          id="prMenuBtn"
          class="menu-btn"
          type="button"
        >
          PR共有
        </button>
      </nav>
    </aside>

    <!-- メイン -->
    <main class="main-content">

      <div class="current-team-bar">
        表示中のチーム：
        <strong id="currentTeamName"></strong>
      </div>

      <div id="taskPage">

        <!-- タスク追加 -->
        <section class="form-section">
        <h2>課題を追加</h2>

        <label for="titleInput">課題名</label>
        <input type="text" id="titleInput">

        <label for="descriptionInput">詳細</label>
        <textarea id="descriptionInput"></textarea>

        <label for="assigneeInput">担当者</label>
        <input type="text" id="assigneeInput">

        <label for="startDateInput">開始日</label>
        <input type="date" id="startDateInput">

        <label for="deadlineInput">締切日</label>
        <input type="date" id="deadlineInput">

        <label for="statusInput">状態</label>
        <select id="statusInput">
          <option value="todo">未着手</option>
          <option value="working">作業中</option>
          <option value="review">確認待ち</option>
          <option value="fix">修正中</option>
          <option value="done">完了</option>
        </select>

        <button id="addBtn">追加</button>

        <p id="errorMessage"></p>
      </section>

      <!-- ダッシュボード -->
      <section class="dashboard-section">
        <h2>ダッシュボード</h2>

        <div class="dashboard-grid">

          <div class="dashboard-card" id="allCard">
            <div class="dashboard-count" id="allCount">0</div>
            <div>全体</div>
          </div>

          <div class="dashboard-card status-todo" id="todoCard">
            <div class="dashboard-count" id="todoCount">0</div>
            <div>未着手</div>
          </div>

          <div class="dashboard-card status-working" id="workingCard">
            <div class="dashboard-count" id="workingCount">0</div>
            <div>作業中</div>
          </div>

          <div class="dashboard-card status-review" id="reviewCard">
            <div class="dashboard-count" id="reviewCount">0</div>
            <div>確認待ち</div>
          </div>

          <div class="dashboard-card status-fix" id="fixCard">
            <div class="dashboard-count" id="fixCount">0</div>
            <div>修正中</div>
          </div>

          <div class="dashboard-card status-done" id="doneCard">
            <div class="dashboard-count" id="doneCount">0</div>
            <div>完了</div>
          </div>

          <div class="dashboard-card expired-card" id="expiredCard">
            <div class="dashboard-count" id="expiredCount">0</div>
            <div>期限切れ</div>
          </div>

        </div>
      </section>

      <!-- 作業管理 -->
      <section class="calendar-section">

        <div class="section-header">
          <h2>作業管理</h2>

          <div class="view-tabs">
            <button id="calendarTab" class="tab-btn active">
              カレンダー
            </button>

            <button id="listTab" class="tab-btn">
              一覧
            </button>

            <button id="ganttTab" class="tab-btn">
              ガント
            </button>

            <button id="boardTab" class="tab-btn">
              ボード
            </button>
          </div>
        </div>

        <!-- 検索 -->
        <div class="search-area">
          <input type="text" id="searchInput" placeholder="課題名・詳細・担当者・状態で検索">
        </div>

        <!-- フィルター -->
        <div class="filter-area">

          <select id="statusFilter">
            <option value="all">すべての状態</option>
            <option value="todo">未着手</option>
            <option value="working">作業中</option>
            <option value="review">確認待ち</option>
            <option value="fix">修正中</option>
            <option value="done">完了</option>
          </select>

          <select id="assigneeFilter">
            <option value="all">すべての担当者</option>
          </select>

          <select id="deadlineFilter">
            <option value="all">すべての期限</option>
            <option value="expired">期限切れのみ</option>
            <option value="today">今日締切のみ</option>
          </select>

          <select id="sortFilter">
            <option value="deadline">締切が近い順</option>
            <option value="startDate">開始日が早い順</option>
            <option value="title">課題名順</option>
            <option value="assignee">担当者順</option>
            <option value="status">状態順</option>
          </select>

        </div>

        <!-- カレンダー -->
        <div id="calendarArea" class="view-content">

          <div class="calendar-header">
            <button id="prevBtn">←</button>
            <button id="todayBtn">今日</button>

            <h3 id="monthTitle"></h3>

            <button id="nextBtn">→</button>
          </div>

          <div id="calendarTableArea"></div>
        </div>

        <!-- 一覧 -->
        <div id="listArea" class="view-content hidden">
          <h3>タスク一覧</h3>
          <div id="taskListArea"></div>
        </div>

        <!-- ガント -->
        <div id="ganttArea" class="view-content hidden">
          <h3>ガントチャート</h3>

          <div class="calendar-header">
            <button id="ganttPrevBtn">←</button>
            <button id="ganttTodayBtn">今日</button>

            <h3 id="ganttMonthTitle"></h3>

            <button id="ganttNextBtn">→</button>
          </div>

          <div id="ganttChartArea"></div>
        </div>

        <!-- ボード -->
        <div id="boardArea" class="view-content hidden">
          <h3>ボード表示</h3>
          <div id="boardContentArea"></div>
        </div>

        </section>

      </div>

      <!-- チャット -->
      <section id="chatPage" class="chat-section hidden">
        <div class="chat-header">
          <div>
            <h2 id="chatTeamTitle">チームチャット</h2>
            <p>
              選択中のチームだけで共有されるメッセージです。
            </p>
          </div>
        </div>

        <div
          id="chatMessageList"
          class="chat-message-list"
          aria-live="polite"
        ></div>

        <form id="chatForm" class="chat-form">
          <div class="chat-form-field">
            <label for="chatSenderInput">名前</label>
            <input
              type="text"
              id="chatSenderInput"
              maxlength="30"
              placeholder="送信者名"
            >
          </div>

          <div class="chat-form-field">
            <label for="chatTextInput">メッセージ</label>
            <textarea
              id="chatTextInput"
              maxlength="1000"
              placeholder="作業状況や相談内容を入力"
            ></textarea>
          </div>

          <div class="chat-form-footer">
            <span>Ctrl + Enterでも送信できます</span>
            <button type="submit" id="chatSendBtn">
              送信
            </button>
          </div>

          <p id="chatErrorMessage" class="chat-error-message"></p>
        </form>
      </section>



      <!-- PR共有 -->
      <section id="prPage" class="pr-section hidden">
        <div class="pr-header">
          <div>
            <h2 id="prTeamTitle">PR共有</h2>
            <p>
              GitHubのPull Requestをチームごとに登録して、レビュー状況を共有します。
            </p>
          </div>
        </div>

        <form id="prForm" class="pr-form">
          <div class="pr-form-grid">
            <div class="pr-form-field pr-form-wide">
              <label for="prTitleInput">PRタイトル</label>
              <input
                type="text"
                id="prTitleInput"
                maxlength="100"
                placeholder="例：プレイヤーのジャンプ処理を追加"
              >
            </div>

            <div class="pr-form-field pr-form-wide">
              <label for="prUrlInput">PRのURL</label>
              <input
                type="url"
                id="prUrlInput"
                maxlength="500"
                placeholder="https://github.com/.../pull/1"
              >
            </div>

            <div class="pr-form-field">
              <label for="prAssigneeInput">担当者</label>
              <input
                type="text"
                id="prAssigneeInput"
                maxlength="30"
                placeholder="担当者名"
              >
            </div>

            <div class="pr-form-field">
              <label for="prStatusInput">状態</label>
              <select id="prStatusInput">
                <option value="draft">下書き</option>
                <option value="review" selected>レビュー待ち</option>
                <option value="changes">修正対応中</option>
                <option value="merged">マージ済み</option>
                <option value="closed">クローズ</option>
              </select>
            </div>

            <div class="pr-form-field pr-form-wide">
              <label for="prTaskSelect">関連タスク</label>
              <select id="prTaskSelect">
                <option value="">関連タスクなし</option>
              </select>
            </div>

            <div class="pr-form-field pr-form-wide">
              <label for="prNoteInput">メモ</label>
              <textarea
                id="prNoteInput"
                maxlength="1000"
                placeholder="確認してほしい点や変更内容を入力"
              ></textarea>
            </div>
          </div>

          <div class="pr-form-footer">
            <span>PRタイトルとURLは必須です</span>
            <button type="submit" id="prAddBtn">
              PRを登録
            </button>
          </div>

          <p id="prErrorMessage" class="pr-error-message"></p>
        </form>

        <div class="pr-list-header">
          <h3>登録済みPR</h3>
          <span id="prCountText">0件</span>
        </div>

        <div
          id="prList"
          class="pr-list"
          aria-live="polite"
        ></div>
      </section>

    </main>

  </div>

</body>

</html>
